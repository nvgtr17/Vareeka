<head>

  <link rel="icon" type="image/svg+xml" href="/assets/logos/Logo Mark/Logomark secondary (pink).svg" />
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Lato:wght@300;400;700&display=swap"
    rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
    rel="stylesheet" />
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            primary: "#f3b6c2",
            secondary: "#1a1a1a",
            "deep-backdrop": "#454065",
            "deep-text": "#454065",
          },
          fontFamily: {
            serif: ['"Playfair Display"', 'serif'],
            sans: ['"Lato"', 'sans-serif'],
          },
          animation: {
            'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
          }
        },
      },
    };
  </script>
  <style>
    @keyframes pulse-custom {
      0% {
        box-shadow: 0 0 0 0 rgba(243, 182, 194, 0.7);
      }

      70% {
        box-shadow: 0 0 0 10px rgba(243, 182, 194, 0);
      }

      100% {
        box-shadow: 0 0 0 0 rgba(243, 182, 194, 0);
      }
    }

    .pulse-marker {
      animation: pulse-custom 2s infinite;
    }

    body {
      background-color: #0f0f0f;
      color: white;
    }
  </style>
